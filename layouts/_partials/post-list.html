{{- $pages := .ByDate.Reverse -}}
{{- if $pages }}
<ol class="post-list">
  {{- range $pages }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
    <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
  </li>
  {{- end }}
</ol>
{{- else }}
<p>No posts yet.</p>
{{- end }}
