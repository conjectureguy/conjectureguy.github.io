<p class="social-links">
  {{- with site.Params.author.github }}<a href="{{ . }}">GitHub</a>{{ end -}}
  {{- with site.Params.author.codeforces }} <span aria-hidden="true">·</span> <a href="{{ . }}">Codeforces</a>{{ end -}}

</p>
