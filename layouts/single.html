{{ define "main" }}
  <article class="article">
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      {{- if eq .Section "blogs" }}
      <p class="article-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>
      {{- end }}
    </header>
    <div class="article-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
